{% extends "base.html" %}
{% load static %}

{% block title %}Sign in — Olive MMS{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-mark mx-auto mb-2"><i class="bi bi-moon-stars"></i></div>
      <h1 class="h4 mb-1">Olive MMS</h1>
      <p class="text-muted small mb-0">Mosque &amp; Madrassa Management System</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2 small">
      Invalid email or password. Please try again.
    </div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label small fw-semibold">Email</label>
        <input type="email" name="username" id="id_username" class="form-control"
               autofocus autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" id="id_password" class="form-control"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
