{% extends "base.html" %}

{% block title %}Events — Olive MMS{% endblock %}

{% block content %}
<div id="event-list-root"
     hx-get="{% url 'events:index' %}{% if request.GET %}?{% for key, value in request.GET.items %}{{ key }}={{ value }}{% if not forloop.last %}&{% endif %}{% endfor %}{% endif %}"
     hx-trigger="listChanged from:body"
     hx-target="this"
     hx-swap="outerHTML">
  {% include "events/partials/event_list_content.html" %}
</div>
{% endblock %}
