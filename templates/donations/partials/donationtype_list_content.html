<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
  <h1 class="h3 mb-0">Donation types</h1>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'donations:index' %}">
      <i class="bi bi-arrow-left"></i> Donations
    </a>
    <button class="btn btn-primary btn-sm" type="button"
            hx-get="{% url 'donations:type_create' %}" hx-target="#genericModalBody" hx-swap="innerHTML"
            data-bs-toggle="modal" data-bs-target="#genericModal">
      <i class="bi bi-plus-lg"></i> Add type
    </button>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Code</th>
          <th>Status</th>
          <th>Account hint</th>
        </tr>
      </thead>
      <tbody>
        {% for type in donationtype_list %}
        <tr>
          <td>{{ type.name }}</td>
          <td><span class="badge text-bg-light border">{{ type.code }}</span></td>
          <td>
            {% if type.is_active %}
            <span class="badge text-bg-success">Active</span>
            {% else %}
            <span class="badge text-bg-secondary">Inactive</span>
            {% endif %}
          </td>
          <td>{{ type.default_account_hint|default:"—" }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="text-center text-muted py-4">No donation types yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
