{% extends "base.html" %}
{% load humanize %}

{% block title %}Donations — Olive MMS{% endblock %}

{% block content %}
<div id="donation-list-root"
     hx-get="{% url 'donations:index' %}{% if request.GET %}?{% for key, value in request.GET.items %}{{ key }}={{ value }}{% if not forloop.last %}&{% endif %}{% endfor %}{% endif %}"
     hx-trigger="listChanged from:body"
     hx-target="this"
     hx-swap="outerHTML">
  {% include "donations/partials/donation_list_content.html" %}
</div>
{% endblock %}
