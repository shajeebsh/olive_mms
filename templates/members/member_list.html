{% extends "base.html" %}
{% load humanize %}

{% block title %}Members — Olive MMS{% endblock %}

{% block content %}
<div id="member-list-root"
     hx-get="{% url 'members:index' %}{% if request.GET %}?{% for key, value in request.GET.items %}{{ key }}={{ value }}{% if not forloop.last %}&{% endif %}{% endfor %}{% endif %}"
     hx-trigger="listChanged from:body"
     hx-target="this"
     hx-swap="outerHTML">
  {% include "members/partials/member_list_content.html" %}
</div>
{% endblock %}
