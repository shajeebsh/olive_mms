{% extends "base.html" %}

{% block title %}Inventory — Olive MMS{% endblock %}

{% block content %}
<div id="item-list-root"
     hx-get="{% url 'inventory:index' %}{% if request.GET %}?{% for key, value in request.GET.items %}{{ key }}={{ value }}{% if not forloop.last %}&{% endif %}{% endfor %}{% endif %}"
     hx-trigger="listChanged from:body"
     hx-target="this"
     hx-swap="outerHTML">
  {% include "inventory/partials/item_list_content.html" %}
</div>
{% endblock %}
